; https://docs.platformio.org/page/projectconf.html

;[env:genericSTM32F103C8]
;platform = ststm32
;board = bluepill_f103c8
;board_build.mcu = stm32f103c8t6
;framework = cmsis
;debug_tool = stlink
;upload_protocol = stlink
;debug_init_break = break setup
;build_flags = -I src/core -I src/drivers -I src/gfx -I src/images -I src/fonts -I src/app -I src/utils

[env:stm32f103rdt6]
platform = ststm32
board = genericSTM32F103RD
board_build.mcu = stm32f103rdt6
framework = cmsis
debug_tool = stlink
upload_protocol = stlink
debug_init_break = break setup
build_flags =
    -I src/core
    -I src/drivers
    -I src/gfx
    -I src/images
    -I src/fonts
    -I src/app
    -I src/utils
    -Wl,-u,_printf_float